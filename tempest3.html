// Authentic color cycle: blue (1-16), red (17-32), yellow (33-48),
// cyan (49-64), white/"invisible" (65-80), green (81-96), then repeats.
const TIER_COLORS = ['#3366FF','#FF2222','#FFDD00','#00DDDD','#DDDDDD','#22FF44'];

function getLevelDef(lv) {
  const wellId = WELLS_ROM.seq[(lv-1) % 16];
  const tier   = Math.floor((lv-1) / 16) % TIER_COLORS.length;
  return { well: wellId, c: TIER_COLORS[tier],
           closed: WELLS_ROM.closed[wellId], name: WELLS_ROM.names[wellId] };
}

function pt(x,y){ return {x,y}; }
function arr(n,f){ return Array.from({length:n},(_,i)=>f(i)); }
function ang(i,n,off=0){ return (i/n)*Math.PI*2+off; }
function lerp2(a,b,t){ return pt(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t); }
function lerpS(a,b,t){ return a+(b-a)*t; }
function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }
function smoothstep(t){ return t*t*(3-2*t); }
function dist2(a,b){ const dx=a.x-b.x,dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }

function buildGeo(def, cx, cy, r) {
  const w = WELLS_ROM.wells[def.well];
  const rimPts = w.map(p => pt(cx + p[0]*r, cy - p[1]*r));  // z up -> screen y down
  const n = rimPts.length;
  const center = pt(cx, cy);
  const lanes = rimPts.map((rA,i)=>{
    const rB = rimPts[(i+1) % n];
    return { rA, rB, mid: pt((rA.x+rB.x)/2,(rA.y+rB.y)/2) };
  });
  // open wells have one fewer lane (the opening between point n-1 and 0)
  const nLanes = def.closed ? n : n-1;
  return { lanes, rimPts, center, n, nLanes, r, closed: def.closed, def };
}

function rebuildGeo() {
  const def = getLevelDef(G.level);
  G.geo = buildGeo(def, CX, CY, RAD);
  G.laneGlow = new Array(G.geo.n).fill(0);
}

function lanePt(geo, lane, depth) {
  const l = geo.lanes[((lane % geo.n)+geo.n) % geo.n];
  return lerp2(l.mid, geo.center, depth);
}

function depthScale(d) { return Math.max(0.05, 1 - d*0.92); }

function stepLane(geo, lane, dir) {
  const n = geo.n;
  if (geo.closed) return ((lane+dir)+n) % n;
  return clamp(lane+dir, 0, geo.nLanes-1);
}

function rightSpoke(lane, n) { return (lane+1) % n; }

// SECTION 3 — AUDIO ENGINE

let AC = null;
let warp = { osc:null, lfo:null, lfoG:null, vca:null, started:false };

function getAC() {
  if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
  return AC;
}
function resumeAC() { try{ if(AC&&AC.state==='suspended') AC.resume(); }catch(e){} }

function startWarpOsc() {
  if (warp.started) return;
  warp.started = true;
  const ac = getAC();
  const osc  = ac.createOscillator();
  const lfo  = ac.createOscillator();
  const lfoG = ac.createGain();
  const vca  = ac.createGain();
  const dist = ac.createWaveShaper();
  const curve = new Float32Array(512);
  for(let i=0;i<512;i++){ const x=i/256-1; curve[i]=Math.tanh(x*2.5)*0.85; }
  dist.curve = curve;
  osc.type='sawtooth'; lfo.type='sine';
  lfo.connect(lfoG); lfoG.connect(osc.frequency);
  osc.connect(dist); dist.connect(vca); vca.connect(ac.destination);
  osc.frequency.value=100; lfo.frequency.value=4; lfoG.gain.value=25; vca.gain.value=0;
  osc.start(); lfo.start();
  warp = { osc, lfo, lfoG, vca, started:true };
}

function setWarpIntensity(v) {
  if (!warp.started) return;
  const ac=getAC(), t=ac.currentTime;
  warp.osc.frequency.setTargetAtTime(90+v*180,   t, 0.06);
  warp.lfo.frequency.setTargetAtTime(3+v*18,      t, 0.06);
  warp.lfoG.gain.setTargetAtTime(20+v*90,         t, 0.06);
  warp.vca.gain.setTargetAtTime(v*0.07,            t, 0.06); // quiet ambient, not a constant drone
}

function tone(freq, type, dur, gain, freqEnd) {
  try {
    const ac=getAC(), o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, ac.currentTime);
    if(freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, ac.currentTime+dur);
    g.gain.setValueAtTime(gain, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}

function noise(dur, gain, lpFreq) {
  try {
    const ac=getAC(), sz=Math.ceil(ac.sampleRate*dur);
    const buf=ac.createBuffer(1,sz,ac.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<sz;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/sz*6);
    const src=ac.createBufferSource(); src.buffer=buf;
    const g=ac.createGain(); g.gain.setValueAtTime(gain, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    if(lpFreq){ const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lpFreq; src.connect(f); f.connect(g); } else { src.connect(g); }
    g.connect(ac.destination); src.start();
  }catch(e){}
}

const SB={};
function loadSamples(){ const ac=getAC(); for(const k in SFXDATA){ fetch(SFXDATA[k]).then(r=>r.arrayBuffer()).then(b=>ac.decodeAudioData(b)).then(buf=>{SB[k]=buf;}).catch(()=>{}); } }
function snd(k,gain){ const buf=SB[k]; if(!buf) return; try{ const ac=getAC(),s=ac.createBufferSource(); s.buffer=buf; const g=ac.createGain(); g.gain.value=(gain==null?0.8:gain); s.connect(g); g.connect(ac.destination); s.start(); }catch(e){} }

const SFX = {
  fire(){ snd('fire',0.7); },
  flipperFlip(){},                         // silent (too frequent to reuse a clip)
  flipperShoot(){ snd('fire',0.32); },     // reuse fire, quieter
  explode(big){ snd('explode', big?0.9:0.7); },
  hitTanker(){ snd('explode',0.4); },
  death(){ snd('death',0.9); },
  zapper(){ snd('warp',0.7); },            // descending sweep ~ closest real clip
  levelDone(){},
  flyThrough(){ snd('warp',0.85); },
  levelTitle(){},                          // silent (no jingle in the original)
  rimHit(){},
};


// ============================================================
// SECTION 4 — INPUT
// ============================================================

const KEYS={}, JP={};
window.addEventListener('keydown', e=>{ if(!KEYS[e.code]) JP[e.code]=true; KEYS[e.code]=true; e.preventDefault(); });
window.addEventListener('keyup',   e=>{ KEYS[e.code]=false; });
let moveCool=0, fireCool=0;

// ============================================================
// SECTION 5 — GAME STATE
// ============================================================

let G = null;

function newGame() {
  G = {
    state:  GS.ATTRACT,
    level:  1,
    score:  0,
    hi:     parseInt(localStorage.getItem('t3hi')||'0'),
    lives:  3,
    geo:    null,
    laneGlow: [],

    player: { lane:0, dead:false, visible:true, blinkT:0 },
    bullets:  [],
    eBullets: [],
    enemies:  [],
    spikes:   [],

    explosions: [],
    scorePopups:[],

    flash:   { r:0,g:0,b:0,a:0 },
    shake:   { x:0,y:0,t:0 },
    warpInt: 0,

    zapper:    { uses:2 },
    invinc:    0,
    paused:    false,
    spawnT:    0, spawnInt:2.4, waveLeft:0,
    cleared:   false,
    enemyMoveT:0,

    flyDepth:  0,
    flyLane:   0,
    flySpeed:  0.45,
    flyMoveCool: 0,

    titleT: 0,
    dt:0, now:0,
  };
}

function startLevel() {
  const def = getLevelDef(G.level);
  G.geo      = buildGeo(def, CX, CY, RAD);
  G.laneGlow = new Array(G.geo.n).fill(0);
  G.player   = { lane:0, dead:false, visible:true, blinkT:0 };
  G.bullets  = []; G.eBullets = []; G.enemies = []; G.spikes = [];
  G.explosions=[]; G.scorePopups=[];
  G.zapper   = { uses:2 };
  G.invinc   = 0; G.cleared = false;
  const diff = Math.min(G.level, 16);
  G.spawnInt = Math.max(0.4, 2.6-diff*0.14);
  G.waveLeft = 5 + diff*3;
  G.spawnT   = 0.6;
  moveCool=0; fireCool=0;
}

// ============================================================
// SECTION 6 — ENEMY SPAWNING & AI
// ============================================================

function spawnEnemy(type, lane) {
  const n=G.geo.nLanes;
  const l = lane!==undefined ? lane : Math.floor(Math.random()*n);
  const diff=Math.min(G.level,16);
  const baseSpd = 0.05 + diff*0.014;
  const e = {
    type, lane:l, depth:0.98, hp: type===ET.TANKER?2:1,
    state: type===ET.FUSEBALL ? 'rim' : 'climbing',
    speed: type===ET.TANKER?baseSpd*0.5 : type===ET.SPIKER?baseSpd*0.65 : type===ET.PULSAR?baseSpd*0.8 : baseSpd,
    angle: 0,
    flipT:0, flipInt:0.5+Math.random()*0.5,
    flipProgress:0, flipFrom:l, flipTo:l, flipping:false,
    rimDir: 0, rimMoveT:0, rimMoveInt:0.18-diff*0.007,
    shootT: 1.0+Math.random()*2.0,
    fuseT:0, fuseInt:Math.max(0.06, 0.14-diff*0.005), fuseDir:Math.random()<0.5?-1:1,
    fuseDirT:0, fuseDirInt:0.5+Math.random()*1.0,
    // pulsar: cycles between idle and "pulsing" (lane electrified, lethal)
    pulseT:Math.random(), pulseInt:1.4, pulseOn:false,
    spikeBase:0.98,
    hitFlash:0, trail:[],
  };
  G.enemies.push(e);
}

function pickType() {
  const lv=G.level, r=Math.random();
  if (lv<3)  return ET.FLIPPER;
  if (lv<4)  return r<0.7?ET.FLIPPER:ET.TANKER;
  // Pulsars enter at the red tier (level 17+ authentically); here we
  // introduce them from level 4 so they're seen, alongside spikers/fuseballs.
  if (lv<6)  return r<0.5?ET.FLIPPER:r<0.72?ET.TANKER:ET.PULSAR;
  if (lv<8)  return r<0.4?ET.FLIPPER:r<0.6?ET.TANKER:r<0.78?ET.PULSAR:ET.SPIKER;
  return r<0.32?ET.FLIPPER:r<0.5?ET.TANKER:r<0.66?ET.PULSAR:r<0.83?ET.SPIKER:ET.FUSEBALL;
}

function updateEnemies(dt) {
  const n=G.geo.n;
  if (G.waveLeft>0){ G.spawnT-=dt; if(G.spawnT<=0){ G.spawnT=G.spawnInt; spawnEnemy(pickType()); G.waveLeft--; } }

  // Warp hum: silent unless an enemy is actually near the rim (outer
  // ~40% of the tube) or crawling the rim. No constant drone.
  let closestD=1.0, rimCount=0;
  G.enemies.forEach(e=>{ if(e.depth<closestD)closestD=e.depth; if(e.state==='rim')rimCount++; });
  let threat = 0;
  if (closestD < 0.4) threat = (0.4 - closestD) / 0.4;        // ramps up only in outer 40%
  threat = Math.min(1, threat + rimCount*0.25);                // rim-crawlers add urgency
  if (Math.abs(threat - G.warpInt) > 0.03) {
    G.warpInt = threat;
    setWarpIntensity(threat);
  }

  for (let i=G.enemies.length-1; i>=0; i--) {
    const e=G.enemies[i];
    e.angle += dt*10;
    const tp=lanePt(G.geo,e.lane,e.depth);
    e.trail.push({x:tp.x,y:tp.y,a:0.5}); if(e.trail.length>5) e.trail.shift();
    e.trail.forEach(t=>t.a-=dt*5);
    if(e.hitFlash>0) e.hitFlash=Math.max(0,e.hitFlash-dt*5);

    if (e.type===ET.FUSEBALL) {
      e.depth=0;
      e.fuseT+=dt;
      if(e.fuseT>=e.fuseInt){
        e.fuseT=0;
        e.lane=stepLane(G.geo,e.lane,e.fuseDir);
        if(G.player&&!G.player.dead&&G.invinc<=0&&e.lane===G.player.lane) hitPlayer();
      }
      e.fuseDirT+=dt;
      if(e.fuseDirT>=e.fuseDirInt){ e.fuseDirT=0; e.fuseDir*=-1; e.fuseDirInt=0.4+Math.random()*0.8; }
      continue;
    }

    if (e.state==='rim') {
      e.depth=0;
      e.rimMoveT+=dt;
      if (e.rimMoveT>=e.rimMoveInt) {
        e.rimMoveT=0;
        if(!G.player) continue;
        const plane=G.player.lane;
        if (e.lane!==plane) {
          let dir;
          if (G.geo.closed) {
            const cw  = ((plane-e.lane)+n)%n;
            const ccw = ((e.lane-plane)+n)%n;
            dir = cw<=ccw ? 1 : -1;
          } else {
            dir = plane>e.lane ? 1 : -1;
          }
          e.lane=stepLane(G.geo,e.lane,dir);
          SFX.rimHit();
        }
        if (G.player&&e.lane===G.player.lane&&!G.player.dead&&G.invinc<=0) { hitPlayer(); G.enemies.splice(i,1); continue; }
      }
      continue;
    }

    e.depth-=e.speed*dt;

    if (e.type===ET.FLIPPER) {
      e.flipT+=dt;
      if (!e.flipping && e.flipT>=e.flipInt) {
        e.flipT=0; e.flipInt=0.45+Math.random()*0.55;
        const dir=Math.random()<0.5?-1:1;
        const newLane=stepLane(G.geo,e.lane,dir);
        if (newLane!==e.lane) {
          e.flipFrom=e.lane; e.flipTo=newLane; e.flipDir=dir; e.flipping=true; e.flipProgress=0;
          SFX.flipperFlip();
        }
      }
      if (e.flipping) {
        e.flipProgress+=dt*7; // slightly faster flip ~0.14s
        if (e.flipProgress>=1) { e.flipProgress=1; e.flipping=false; e.lane=e.flipTo; }
      }
      e.shootT-=dt;
      if(e.shootT<=0){ e.shootT=1.2+Math.random()*2.0-G.level*0.04; if(e.depth<0.78){ G.eBullets.push({lane:e.lane,depth:e.depth-0.03,speed:0.5+G.level*0.025}); SFX.flipperShoot(); } }
    }

    if (e.type===ET.PULSAR) {
      // Pulse cycle: idle, then "on" for the latter part of the cycle.
      // While on, the whole lane is electrified and lethal.
      e.pulseT+=dt;
      if (e.pulseT>=e.pulseInt) e.pulseT=0;
      const wasOn=e.pulseOn;
      e.pulseOn = e.pulseT > e.pulseInt*0.6;
      if (e.pulseOn && !wasOn) SFX.flipperFlip();
      if (e.pulseOn && G.player && !G.player.dead && G.invinc<=0 && e.lane===G.player.lane) { hitPlayer(); }
      // pulsars also flip across lanes
      e.flipT+=dt;
      if (!e.flipping && !e.pulseOn && e.flipT>=e.flipInt) {
        e.flipT=0; e.flipInt=0.6+Math.random()*0.7;
        const dir=Math.random()<0.5?-1:1;
        const newLane=stepLane(G.geo,e.lane,dir);
        if (newLane!==e.lane){ e.flipFrom=e.lane; e.flipTo=newLane; e.flipDir=dir; e.flipping=true; e.flipProgress=0; }
      }
      if (e.flipping){ e.flipProgress+=dt*6; if(e.flipProgress>=1){ e.flipProgress=1; e.flipping=false; e.lane=e.flipTo; } }
    }

    if (e.depth<=0) {
      e.depth=0;
      if (e.type===ET.SPIKER) {
        addSpike(e.lane, 0, e.spikeBase);
        G.enemies.splice(i,1); continue;
      }
      if (e.type===ET.TANKER) {
        if (G.player&&!G.player.dead&&G.invinc<=0&&e.lane===G.player.lane) hitPlayer();
        G.enemies.splice(i,1); continue;
      }
      if (e.type===ET.FLIPPER || e.type===ET.PULSAR) {
        e.state='rim';
        e.rimDir = G.player ? (G.player.lane>e.lane ? 1 : -1) : 1;
        if(G.player&&e.lane===G.player.lane&&!G.player.dead&&G.invinc<=0){ hitPlayer(); G.enemies.splice(i,1); }
        continue;
      }
    }
  }

  for(let i=G.eBullets.length-1;i>=0;i--){
    const b=G.eBullets[i]; b.depth-=b.speed*dt;
    if(b.depth<=0){ if(G.player&&!G.player.dead&&G.invinc<=0&&b.lane===G.player.lane) hitPlayer(); G.eBullets.splice(i,1); }
  }
}

function addSpike(lane, tipD, baseD) {
  G.spikes = G.spikes.filter(s=>s.lane!==lane);
  G.spikes.push({ lane, tipD, baseD });
}

// ============================================================
// SECTION 7 — BULLETS & COLLISION
// ============================================================

function updateBullets(dt) {
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i]; b.depth+=b.speed*dt;
    G.laneGlow[b.lane % G.geo.n]=1.0;

    let hit=false;

    for(let j=G.spikes.length-1;j>=0;j--){
      const s=G.spikes[j];
      if(s.lane===b.lane && b.depth>=s.tipD && b.depth<=s.baseD+0.05){
        addScore(50, lanePt(G.geo,b.lane,s.tipD+0.1));
        boom(b.lane,s.tipD+0.1,false);
        G.spikes.splice(j,1); hit=true; break;
      }
    }

    if(!hit){
      for(let j=G.enemies.length-1;j>=0;j--){
        const e=G.enemies[j];
        const eLane = e.flipping ? e.flipFrom : e.lane;
        if(eLane===b.lane && Math.abs(e.depth-b.depth)<0.08){
          hit=true; doDamageEnemy(e,j); break;
        }
        if(e.state==='rim' && e.lane===b.lane && b.depth<=0.18){
          hit=true; doDamageEnemy(e,j); break;
        }
      }
    }
    if(hit||b.depth>=1.0) G.bullets.splice(i,1);
  }
}

function doDamageEnemy(e, idx) {
  e.hp--; e.hitFlash=1.0;
  if(e.hp<=0){ killEnemy(e); G.enemies.splice(idx,1); }
  else SFX.hitTanker();
}

function killEnemy(e, zap) {
  const pts = zap ? Math.floor(basePoints(e)/2) : basePoints(e);
  addScore(pts, lanePt(G.geo,e.lane,e.depth));
  boom(e.lane,e.depth, e.type===ET.TANKER);
  SFX.explode(e.type===ET.TANKER);
  if(e.type===ET.TANKER){
    spawnEnemy(ET.FLIPPER, e.lane);
    spawnEnemy(ET.FLIPPER, stepLane(G.geo,e.lane,1));
  }
  if(e.type===ET.SPIKER && e.depth>0.05){
    addSpike(e.lane, e.depth, e.spikeBase);
  }
}

function basePoints(e){ return [150,100,50,250,200][e.type]||100; }

function hitPlayer() {
  if(!G.player||G.invinc>0||G.player.dead) return;
  G.player.dead=true; G.player.visible=false;
  G.lives--;
  G.flash={r:255,g:30,b:0,a:1.0};
  G.shake={x:0,y:0,t:0.6};
  boom(G.player.lane,0,true);
  SFX.death();
  setWarpIntensity(0); G.warpInt=0;
  G.state=GS.DEAD_PAUSE;
  setTimeout(()=>{
    if(G.lives<=0){ G.state=GS.GAME_OVER; return; }
    G.player.dead=false; G.player.visible=true;
    G.invinc=3.0; G.player.blinkT=3.0;
    G.state=GS.PLAYING;
  }, 1500);
}

function fireZapper() {
  if(G.zapper.uses<=0) return;
  SFX.zapper();
  G.flash={r:255,g:255,b:255,a:1.0};
  G.zapper.uses--;
  if(G.zapper.uses===1){
    // First use: clear all
    const all=[...G.enemies]; G.enemies=[];
    all.forEach(e=>killEnemy(e,true));
  } else {
    // Second use: single kill
    if(G.enemies.length>0){ const e=G.enemies.splice(0,1)[0]; killEnemy(e,true); }
  }
}

function addScore(v, pos) {
  G.score+=v;
  if(G.score>G.hi){ G.hi=G.score; localStorage.setItem('t3hi',G.hi); }
  if(pos) G.scorePopups.push({x:pos.x,y:pos.y,text:'+'+v,t:0,dur:0.7});
  // Bonus life at 10k and 40k
  if((G.score>=10000&&G.score-v<10000)||(G.score>=40000&&G.score-v<40000)){
    G.lives++; tone(1200,'square',0.3,0.3,2400);
  }
}

// ============================================================
// SECTION 8 — EFFECTS
// ============================================================

function boom(lane, depth, big) {
  const p=lanePt(G.geo,lane,depth);
  const cnt=big?18:9;
  const pars=arr(cnt,i=>{ const a=(i/cnt)*Math.PI*2+Math.random()*0.4; const spd=(45+Math.random()*90)*(big?2:1); return {x:p.x,y:p.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1}; });
  G.explosions.push({pars,t:0,dur:big?0.55:0.3});
}

function updateEffects(dt) {
  G.explosions.forEach((e,i)=>{ e.t+=dt; const f=e.t/e.dur; e.pars.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.88;p.vy*=0.88;p.life=1-f;}); });
  G.explosions = G.explosions.filter(e=>e.t<e.dur);
  G.scorePopups.forEach(s=>{ s.t+=dt; s.y-=dt*28; }); G.scorePopups=G.scorePopups.filter(s=>s.t<s.dur);
  if(G.flash.a>0) G.flash.a=Math.max(0,G.flash.a-dt*3.2);
  if(G.shake.t>0){ G.shake.t-=dt; const m=14*(G.shake.t/0.6); G.shake.x=(Math.random()*2-1)*m; G.shake.y=(Math.random()*2-1)*m; if(G.shake.t<=0){G.shake.x=0;G.shake.y=0;} }
  for(let i=0;i<G.laneGlow.length;i++) G.laneGlow[i]=Math.max(0,G.laneGlow[i]-dt*6);
}

// ============================================================
// SECTION 9 — FLY-THROUGH
// ============================================================

function startFlythrough() {
  if (G.state !== GS.PLAYING) return;
  setWarpIntensity(0); G.warpInt=0;
  G.state   = GS.FLYTHROUGH;
  G.flyDepth= 0;
  G.flyLane = G.player.lane;
  G.flyMoveCool=0;
  SFX.flyThrough();
}

function updateFlythrough(dt) {
  G.flyMoveCool-=dt;
  if((KEYS['ArrowLeft']||KEYS['KeyA'])&&G.flyMoveCool<=0){
    G.flyLane=stepLane(G.geo,G.flyLane,-1); G.flyMoveCool=0.1;
  }
  if((KEYS['ArrowRight']||KEYS['KeyD'])&&G.flyMoveCool<=0){
    G.flyLane=stepLane(G.geo,G.flyLane,1); G.flyMoveCool=0.1;
  }

  G.flyDepth += G.flySpeed*dt;

  if(G.lives>0){
    for(const s of G.spikes){
      if(s.lane===G.flyLane && G.flyDepth>=s.tipD && G.flyDepth<=s.baseD+0.08){
        G.lives--;
        G.flash={r:255,g:100,b:0,a:0.9};
        G.shake={x:0,y:0,t:0.4};
        SFX.death();
        G.spikes=G.spikes.filter(sx=>sx.lane!==s.lane);
        if(G.lives<=0){ setTimeout(()=>{ G.state=GS.GAME_OVER; },1000); return; }
        break;
      }
    }
  }

  if(G.flyDepth>=1.0){
    G.level++;
    startLevel();
    G.titleT=0;
    G.state=GS.LEVEL_TITLE;
    SFX.levelTitle();
  }
}

// ============================================================
// SECTION 10 — RENDERING
// ============================================================

// All draw functions use the global `ctx`, which is redirected to
// offCtx for geometry and mainCtx for HUD/overlay.

function vecLine(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }

// Two-pass bloom: draw offCanvas to main (sharp + blurred-additive)
function compositeToMain() {
  // Sharp layer
  mainCtx.drawImage(offCanvas, 0, 0);
  // Bloom layer: same image, blurred, added on top — creates authentic vector hot-spots
  mainCtx.save();
  mainCtx.filter = 'blur(5px)';
  mainCtx.globalCompositeOperation = 'lighter';
  mainCtx.globalAlpha = 0.5;
  mainCtx.drawImage(offCanvas, 0, 0);
  mainCtx.restore();
}

// Redirect ctx to offscreen for geometry phase
function beginGeo() {
  offCtx.clearRect(0, 0, W, H);
  ctx = offCtx;
}

// Restore ctx to main and composite
function endGeo() {
  ctx = mainCtx;
  compositeToMain();
}

function drawWeb(geo, col, scaleFrom1) {
  const n=geo.n, rp=geo.rimPts;
  const cx=geo.center.x, cy=geo.center.y;

  ctx.save();
  // Counter-scale line widths so the zoom keeps lines pinstripe-thin
  // (a plain ctx.scale would fatten every stroke as the tube zooms in).
  const lw = (scaleFrom1 && scaleFrom1!==1) ? 1/scaleFrom1 : 1;
  if(scaleFrom1 && scaleFrom1!==1){ ctx.translate(cx,cy); ctx.scale(scaleFrom1,scaleFrom1); ctx.translate(-cx,-cy); }

  ctx.lineCap='round'; ctx.strokeStyle=col;

  // Normal spokes — all batched into a single path
  ctx.beginPath(); ctx.lineWidth=1.5*lw;
  for(let i=0;i<n;i++){
    if(!(G.laneGlow[i]>0.05)){ ctx.moveTo(rp[i].x,rp[i].y); ctx.lineTo(cx,cy); }
  }
  ctx.stroke();

  // Glowing spokes — individual (need wider lineWidth + white)
  for(let i=0;i<n;i++){
    const gv=G.laneGlow[i]||0;
    if(gv>0.05){
      ctx.beginPath(); ctx.lineWidth=(1.5+gv*2.5)*lw; ctx.strokeStyle='#FFFFFF';
      ctx.moveTo(rp[i].x,rp[i].y); ctx.lineTo(cx,cy); ctx.stroke();
      ctx.strokeStyle=col;
    }
  }

  // Rim segments — batched into single path
  ctx.beginPath(); ctx.lineWidth=2.0*lw; ctx.strokeStyle=col;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    if(!geo.closed&&j===0) continue;
    ctx.moveTo(rp[i].x,rp[i].y); ctx.lineTo(rp[j].x,rp[j].y);
  }
  ctx.stroke();

  // Player lane highlight
  if(G.player&&!G.player.dead){
    const l=geo.lanes[G.player.lane];
    ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=3.0*lw;
    ctx.beginPath(); ctx.moveTo(l.rA.x,l.rA.y); ctx.lineTo(l.rB.x,l.rB.y); ctx.stroke();
    ctx.strokeStyle=col;
  }

  // Inner rings — 5 rings, higher alpha for stronger depth cue
  for(const t of INNER_T){
    const ipts=rp.map(p=>lerp2(p,geo.center,t));
    ctx.globalAlpha=0.45; ctx.lineWidth=0.9*lw;
    ctx.beginPath(); ctx.moveTo(ipts[0].x,ipts[0].y);
    for(let i=1;i<n;i++) ctx.lineTo(ipts[i].x,ipts[i].y);
    if(geo.closed) ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha=1;
  }

  ctx.restore();
}

// actually draws (CINVA1). Lane-local: x across the lane, y into the tube.
// FLITAB is all one frame, so the flipper doesn't flap — it just flips lanes.
const FLIP = [[-1.0,-0.25],[0.0,0.0],[1.0,-0.25],[0.5,0.0],[0.75,0.25],[0.0,0.0],[-0.75,0.25],[-0.5,0.0],[-1.0,-0.25]];

// Pulsar — exact PULS0S..PULS4E frames from the ROM (ALDIS2.MAC): a line
// that grows from flat (idle) to a full-amplitude zig-zag (peak pulse).
const PULSAR_FRAMES = [[[-0.75,0.0],[0.75,0.0]],[[-0.75,0.0],[-0.25,-0.25],[0.25,0.25],[0.75,0.0]],[[-0.75,0.0],[-0.5,-0.25],[-0.25,0.25],[0.0,-0.25],[0.25,0.25],[0.5,-0.25],[0.75,0.0]],[[-0.75,0.0],[-0.5,-0.5],[-0.25,0.5],[0.0,-0.5],[0.25,0.5],[0.5,-0.5],[0.75,0.0]],[[-1.0,0.0],[-0.5,-0.75],[-0.25,0.75],[0.0,-0.75],[0.25,0.75],[0.5,-0.75],[1.0,0.0]]];
// Stroke a ROM sprite (array of subpaths). color overrides per-subpath
// color when given (mono sprites); pass null to keep ROM colors (fuseball).
function romStroke(subpaths, s, color){
  for(const sp of subpaths){
    const pts = sp.p || sp;
    ctx.strokeStyle = color || sp.c || '#FFFFFF';
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){ const X=pts[i][0]*s, Y=-pts[i][1]*s; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
    ctx.stroke();
  }
}
const MOVE_DUR = 0.07;   // claw crawl-to-next-lane time
function drawClaw(geo, lane, depth, col) {
  const p = G.player;
  // Interpolate the lane's rim geometry from the previous lane so the claw
  // crawls/pops to the next column instead of teleporting.
  let l = geo.lanes[lane], rA=l.rA, rB=l.rB, mid0=l.mid;
  if(p && p.moveT>0 && p.prevLane!=null && p.prevLane!==lane){
    const pl=geo.lanes[p.prevLane]; const f=smoothstep(1 - p.moveT/MOVE_DUR);
    rA=lerp2(pl.rA,l.rA,f); rB=lerp2(pl.rB,l.rB,f); mid0=lerp2(pl.mid,l.mid,f);
  }
  const mid = depth===0 ? mid0 : lerp2(mid0, geo.center, depth);

  const dx=rB.x-rA.x, dy=rB.y-rA.y;
  const rl=Math.sqrt(dx*dx+dy*dy)||1;
  const tx=dx/rl, ty=dy/rl;                 // tangent (along rim)
  const cx=geo.center.x-mid0.x, cy=geo.center.y-mid0.y;
  const il=Math.sqrt(cx*cx+cy*cy)||1;
  const nx=cx/il, ny=cy/il;                 // inward normal (toward center)

  // Size the claw to ~one lane width; depth proportional.
  const halfW = rl*0.42*depthScale(depth)*1.0 || Math.min(W,H)*0.03;
  const dLen  = halfW*0.9;

  // Movement lean: bank toward the move direction, decaying after each step.
  const lean = (p && p.leanT>0) ? (p.leanDir||0)*(p.leanT/0.16)*0.5 : 0;
  const ca=Math.cos(lean), sa=Math.sin(lean);
  const P=(t,d)=>{
    const tt = t*ca - d*sa, dd = t*sa + d*ca;   // tilt in the (across, inward) plane
    return {x: mid.x + tx*tt*halfW + nx*dd*dLen, y: mid.y + ty*tt*halfW + ny*dd*dLen};
  };
  ctx.save();
  ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  CLAW.forEach((q,i)=>{ const w=P(q[0],q[1]); i?ctx.lineTo(w.x,w.y):ctx.moveTo(w.x,w.y); });
  ctx.stroke();
  ctx.restore();
}

function drawBullets(geo, bullets) {
  // Authentic player charge: a small yellow diamond blip flying down the lane.
  ctx.save();
  ctx.lineCap='round'; ctx.strokeStyle='#FFEE33'; ctx.fillStyle='#FFEE33'; ctx.lineWidth=2;
  for(const b of bullets){
    const p=lanePt(geo,b.lane,b.depth);
    const sc=depthScale(b.depth), r=Math.min(W,H)*0.011*sc+2;
    ctx.beginPath();
    ctx.moveTo(p.x,p.y-r); ctx.lineTo(p.x+r,p.y);
    ctx.lineTo(p.x,p.y+r); ctx.lineTo(p.x-r,p.y);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawEBullets(geo, bullets) {
  ctx.save();
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=2;  // enemy shot = white (authentic)
  for(const b of bullets){
    const p=lanePt(geo,b.lane,b.depth);
    const p2=lanePt(geo,b.lane,Math.min(1,b.depth+0.05));
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.stroke();
    vecLine(p.x,p.y,p2.x,p2.y);
  }
  ctx.restore();
}

// A pulsing pulsar electrifies its entire lane — a bright white zig-zag
// from rim to center. Drawn in world coordinates (no translate).
function drawPulseLane(geo, lane) {
  const rim=geo.lanes[lane].mid, ctr=geo.center;
  const dx=ctr.x-rim.x, dy=ctr.y-rim.y, L=Math.hypot(dx,dy)||1;
  const px=-dy/L, py=dx/L, segs=8;
  ctx.save();
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=2.4; ctx.lineCap='round';
  ctx.beginPath();
  for(let k=0;k<=segs;k++){
    const f=k/segs, b=lerp2(rim,ctr,f);
    const amp=(k%2?1:-1)*Math.min(W,H)*0.013*(1-f*0.55);
    const x=b.x+px*amp, y=b.y+py*amp;
    if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
}

function drawEnemies(geo, enemies, webCol) {
  for(const e of enemies){
    for(const tr of e.trail){
      if(tr.a<=0) continue;
      ctx.globalAlpha=tr.a*0.35;
      ctx.fillStyle=webCol;
      ctx.beginPath(); ctx.arc(tr.x,tr.y,3,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }

    const col   = e.hitFlash>0 ? '#FFFFFF' : enemyColor(e.type);
    const depth = e.depth;
    const sc    = depthScale(depth);
    const sz    = Math.min(W,H)*0.022*sc;
    let   px, py;

    if(e.flipping){
      // Authentic cartwheel: rotate the body 180° about the shared rim
      // corner between the two lanes, so it tumbles end-over-end.
      const t     = smoothstep(e.flipProgress);
      const dir   = e.flipDir || 1;
      const shared= dir>0 ? (e.flipFrom+1)%geo.n : ((e.flipFrom%geo.n)+geo.n)%geo.n;
      const pivot = lerp2(geo.rimPts[shared], geo.center, depth);
      const base  = lanePt(geo, e.flipFrom, depth);
      const ang   = dir * Math.PI * t;
      const ca=Math.cos(ang), sa=Math.sin(ang);
      const ox=base.x-pivot.x, oy=base.y-pivot.y;
      px = pivot.x + ox*ca - oy*sa;
      py = pivot.y + ox*sa + oy*ca;
      // 180° about the corner lands ~exactly on the next lane for a
      // circle, but curved webs leave a small gap — correct it to the
      // true destination, ramped by t so there's no visible snap.
      const tgt = lanePt(geo, e.flipTo, depth);
      const endX = 2*pivot.x - base.x, endY = 2*pivot.y - base.y;
      px += (tgt.x - endX) * t;
      py += (tgt.y - endY) * t;
    } else {
      const p = lanePt(geo, e.lane, depth);
      px=p.x; py=p.y;
    }

    // Pulsing pulsar electrifies its whole lane (drawn in world coords).
    if(e.type===ET.PULSAR && e.pulseOn && !e.flipping) drawPulseLane(geo, e.lane);

    ctx.save();
    ctx.translate(px,py);
    ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.lineCap='round';

    switch(e.type){
      case ET.FLIPPER: {
        // Real flipper INVA1S, lane-local: x across the lane, y into the
        // tube. We map it across the lane (the ~95% stand-in for the
        // arcade's tube projection) and cartwheel on flips.
        const cx=geo.center.x, cy=geo.center.y;
        const fb = e.flipping ? lanePt(geo,e.flipFrom,depth) : {x:px,y:py};
        const baseAng = Math.atan2(fb.y-cy, fb.x-cx);
        const tumble  = e.flipping ? (e.flipDir||1)*Math.PI*smoothstep(e.flipProgress) : 0;
        ctx.rotate(baseAng + Math.PI/2 + tumble);
        // x across the lane, y stretched into depth so it reads with height
        const wAcross = sz*1.5, hDepth = sz*3.2;
        ctx.lineWidth=2.0;
        ctx.beginPath();
        FLIP.forEach((p,i)=>{ const X=p[0]*wAcross, Y=-p[1]*hDepth; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
        ctx.stroke();
        break;
      }
      case ET.TANKER: {
        // GENTNK double-cell box, long axis along the tube.
        const cx=geo.center.x, cy=geo.center.y;
        ctx.rotate(Math.atan2(py-cy, px-cx) + Math.PI/2);
        ctx.lineWidth=1.9;
        ctx.beginPath();
        TANK.forEach((p,i)=>{ const X=p[0]*sz*1.0, Y=p[1]*sz*1.5; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
        ctx.stroke();
        break;
      }
      case ET.SPIKER: {
        // Exact ROM spiral (SPIRA1..4); the 4 frames spin it.
        ctx.lineWidth=1.7;
        romStroke(ROM.spiker[Math.floor(e.angle*2)%4], sz*1.3, col);
        break;
      }
      case ET.FUSEBALL: {
        // Exact ROM fuseball (FUSE0..3): 5 colored prongs, crackle-animated.
        ctx.lineWidth=1.6;
        romStroke(ROM.fuse[Math.floor(e.angle*2.5)%4], sz*1.3, e.hitFlash>0?'#FFFFFF':null);
        ctx.fillStyle='#FFFFFF';
        ctx.beginPath(); ctx.arc(0,0,sz*0.24,0,Math.PI*2); ctx.fill();
        break;
      }
      case ET.PULSAR: {
        // Exact ROM pulsar (PULS0..4): a zig-zag along the lane that
        // charges from flat to full amplitude as it pulses. Oriented
        // radially and cartwheels when flipping.
        const cx=geo.center.x, cy=geo.center.y;
        const fb = e.flipping ? lanePt(geo,e.flipFrom,depth) : {x:px,y:py};
        const baseAng = Math.atan2(fb.y-cy, fb.x-cx);
        const tumble  = e.flipping ? (e.flipDir||1)*Math.PI*smoothstep(e.flipProgress) : 0;
        ctx.rotate(baseAng + Math.PI/2 + tumble);
        // pulse charge -> frame 0 (flat) .. 4 (full zig-zag)
        let pf = 0;
        if (e.pulseOn) { const ph=(e.pulseT - e.pulseInt*0.6)/(e.pulseInt*0.4); pf = Math.max(1, Math.min(4, 1+Math.floor(ph*4))); }
        ctx.strokeStyle = e.pulseOn ? '#FFFFFF' : col;
        ctx.lineWidth   = e.pulseOn ? 2.4 : 1.8;
        const s=sz*1.7, fr=PULSAR_FRAMES[pf];
        ctx.beginPath();
        // ROM x = along lane (radial -> local y), y = across (tangent -> local x)
        for(let i=0;i<fr.length;i++){ const X=fr[i][1]*s, Y=fr[i][0]*s; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
        ctx.stroke();
        break;
      }
    }
    ctx.restore();
  }
}
// Authentic arcade colors: flipper RED, tanker PURPLE, spiker GREEN,
// fuseball multi-colored, pulsar TURQUOISE (white when pulsing).
function enemyColor(t){ return ['#FF2020','#C040FF','#22FF22','#FFFFFF','#00E0E0'][t]||'#FFFFFF'; }

function drawSpikes(geo, spikes) {
  ctx.save();
  ctx.strokeStyle='#22FF22'; ctx.lineWidth=2;  // spikes are green (authentic)
  for(const s of spikes){
    const p0=lanePt(geo,s.lane,s.tipD);
    const p1=lanePt(geo,s.lane,Math.min(s.baseD,0.99));
    ctx.setLineDash([5,4]);
    vecLine(p0.x,p0.y,p1.x,p1.y);
    ctx.setLineDash([]);
    ctx.fillStyle='#88FF88';
    ctx.beginPath(); ctx.arc(p0.x,p0.y,3.5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawLiveSpikeTrails(geo, enemies) {
  ctx.save();
  ctx.strokeStyle='#22CC22'; ctx.lineWidth=1.8;
  ctx.setLineDash([4,4]);
  for(const e of enemies){
    if(e.type!==ET.SPIKER || e.state!=='climbing') continue;
    const p0=lanePt(geo,e.lane,e.depth);
    const p1=lanePt(geo,e.lane,e.spikeBase);
    vecLine(p0.x,p0.y,p1.x,p1.y);
  }
  ctx.setLineDash([]);
  ctx.restore();
}

function drawExplosions() {
  ctx.save(); ctx.lineWidth=1.8; ctx.lineCap='round';
  for(const exp of G.explosions){
    for(const p of exp.pars){
      if(p.life<=0) continue;
      const g=Math.floor(180*p.life);
      ctx.strokeStyle=`rgba(255,${g},0,${p.life})`;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*0.055,p.y-p.vy*0.055); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawScorePopups() {
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=`bold ${Math.min(W,H)*0.025}px monospace`;
  for(const sp of G.scorePopups){
    ctx.globalAlpha=1-sp.t/sp.dur; ctx.fillStyle='#FFFF66';
    ctx.fillText(sp.text,sp.x,sp.y);
  }
  ctx.globalAlpha=1; ctx.restore();
}

function drawScreenFlash() {
  if(G.flash.a<=0) return;
  mainCtx.save(); mainCtx.globalAlpha=G.flash.a; mainCtx.fillStyle=`rgb(${G.flash.r},${G.flash.g},${G.flash.b})`; mainCtx.fillRect(0,0,W,H); mainCtx.restore();
}

// ============================================================
// SECTION 11 — HUD & SCREENS
// ============================================================

// HUD always draws to mainCtx (crisp, no bloom decay)
function drawHUD(col) {
  const sz=Math.min(W,H)*0.026;
  mainCtx.save();
  mainCtx.textBaseline='top'; mainCtx.font=`bold ${sz}px monospace`;

  mainCtx.fillStyle='#CCFFCC'; mainCtx.textAlign='left';  mainCtx.fillText(`${G.score}`,18,12);
  mainCtx.fillStyle='#FFDD66'; mainCtx.textAlign='right'; mainCtx.fillText(`HI  ${G.hi}`,W-18,12);

  mainCtx.font=`${sz*0.75}px monospace`;
  mainCtx.fillStyle=col; mainCtx.textAlign='left'; mainCtx.fillText(`LV ${G.level}  ${getLevelDef(G.level).name}`,18,14+sz*1.1);

  const ly=12+sz*0.25;
  for(let i=0;i<G.lives;i++){
    const lx=W/2+(i-(G.lives-1)/2)*22;
    mainCtx.save();
    mainCtx.strokeStyle='#AAFFAA'; mainCtx.lineWidth=1.4;
    const s=8;
    mainCtx.beginPath(); mainCtx.moveTo(lx-s,ly+s/2); mainCtx.lineTo(lx,ly-s/2); mainCtx.lineTo(lx+s,ly+s/2); mainCtx.stroke();
    mainCtx.beginPath(); mainCtx.moveTo(lx-s*0.5,ly+s/2); mainCtx.lineTo(lx,ly+s*0.1); mainCtx.lineTo(lx+s*0.5,ly+s/2); mainCtx.stroke();
    mainCtx.restore();
  }

  mainCtx.font=`${sz*0.68}px monospace`;
  mainCtx.fillStyle=G.zapper.uses>0?'#FFAA00':'#443300';
  mainCtx.textAlign='left'; mainCtx.textBaseline='bottom';
  mainCtx.fillText(`[Z] ZAPPER ×${G.zapper.uses}`,18,H-14);
  mainCtx.fillStyle='#888888'; mainCtx.textAlign='right';
  mainCtx.fillText('[P] PAUSE',W-18,H-14);

  mainCtx.restore();
}

function drawAttractScreen() {
  const t=G.now*0.001;
  const def=getLevelDef(Math.floor(t*0.3)%16 + 1);
  const spinGeo=buildGeo(def,CX,CY,RAD*0.88);
  const spinCol=def.c;

  // Web goes to offscreen (gets bloom)
  beginGeo();
  const _savedPlayer=G.player, _savedGlow=G.laneGlow;
  G.laneGlow=new Array(spinGeo.n).fill(0); G.player=null;
  drawWeb(spinGeo, spinCol);
  G.player=_savedPlayer; G.laneGlow=_savedGlow;
  endGeo(); // composites to main

  // Text overlay directly to main (crisp)
  const sz=Math.min(W,H);
  mainCtx.save();
  mainCtx.textAlign='center'; mainCtx.textBaseline='middle';
  const fl=0.82+0.18*Math.sin(t*3.3);
  mainCtx.globalAlpha=fl;
  mainCtx.font=`bold ${sz*0.12}px monospace`;
  mainCtx.fillStyle=spinCol;
  mainCtx.fillText('TEMPEST',CX,CY-sz*0.13);
  mainCtx.globalAlpha=1;
  mainCtx.font=`bold ${sz*0.040}px monospace`;
  mainCtx.fillStyle='#FFFFFF';
  mainCtx.fillText('INSERT COIN  ·  PRESS SPACE',CX,CY+sz*0.03);
  mainCtx.font=`${sz*0.024}px monospace`;
  mainCtx.fillStyle='#AAAAAA';
  mainCtx.fillText('← → MOVE   SPACE FIRE   Z ZAPPER   P PAUSE',CX,CY+sz*0.10);
  mainCtx.restore();
}

function drawGameOverScreen() {
  const sz=Math.min(W,H);
  mainCtx.save();
  mainCtx.textAlign='center'; mainCtx.textBaseline='middle';
  mainCtx.font=`bold ${sz*0.10}px monospace`;
  mainCtx.fillStyle='#FF2222';
  mainCtx.fillText('GAME OVER',CX,CY-sz*0.08);
  mainCtx.font=`${sz*0.045}px monospace`;
  mainCtx.fillStyle='#CCFFCC';
  mainCtx.fillText(`SCORE  ${G.score}`,CX,CY+sz*0.01);
  mainCtx.font=`${sz*0.034}px monospace`;
  mainCtx.fillStyle='#FFDD66';
  mainCtx.fillText(`HIGH SCORE  ${G.hi}`,CX,CY+sz*0.08);
  const blink=Math.floor(G.now/500)%2;
  if(blink){ mainCtx.font=`bold ${sz*0.036}px monospace`; mainCtx.fillStyle='#FFFFFF'; mainCtx.fillText('PRESS SPACE TO PLAY AGAIN',CX,CY+sz*0.17); }
  mainCtx.restore();
}

function drawLevelTitleScreen() {
  const def=getLevelDef(G.level);
  const sz=Math.min(W,H);
  const f=Math.min(1,(G.titleT/0.4));
  mainCtx.save();
  mainCtx.globalAlpha=f;
  mainCtx.textAlign='center'; mainCtx.textBaseline='middle';
  mainCtx.font=`bold ${sz*0.065}px monospace`;
  mainCtx.fillStyle=def.c;
  mainCtx.fillText(`LEVEL  ${G.level}`,CX,CY-sz*0.04);
  mainCtx.font=`${sz*0.036}px monospace`;
  mainCtx.fillStyle='#AAAAAA';
  mainCtx.fillText(def.name + (def.closed ? '' : '  [OPEN]'),CX,CY+sz*0.04);
  mainCtx.restore();
}

function drawFlythroughOverlay(geo, flyLane, flyDepth) {
  for(const s of G.spikes){
    const p0=lanePt(geo,s.lane,s.tipD), p1=lanePt(geo,s.lane,Math.min(s.baseD,0.99));
    ctx.save(); ctx.strokeStyle='#FF2200'; ctx.lineWidth=3;
    vecLine(p0.x,p0.y,p1.x,p1.y); ctx.restore();
  }
  if(flyDepth<1) drawClaw(geo, flyLane, flyDepth, '#CCFFCC');
}

// ============================================================
// SECTION 12 — INPUT HANDLER
// ============================================================

function handleInput(dt) {
  moveCool-=dt; fireCool-=dt;

  if(G.state===GS.ATTRACT||G.state===GS.GAME_OVER){
    if(JP['Space']||JP['Enter']){
      newGame(); startLevel(); G.state=GS.LEVEL_TITLE; G.titleT=0;
      startWarpOsc(); resumeAC(); loadSamples(); SFX.levelTitle();
    }
    return;
  }
  if(G.state!==GS.PLAYING) return;
  if(!G.player||G.player.dead) return;

  // Instant first press via JP[], fast repeat via KEYS + cooldown.
  // moveStep records prevLane + leanDir so the claw banks toward the move
  // and crawls/pops to the next column instead of teleporting.
  const moveStep=(dir)=>{
    const from=G.player.lane, to=stepLane(G.geo,from,dir);
    if(to!==from){ G.player.prevLane=from; G.player.moveT=MOVE_DUR; }
    G.player.lane=to; moveCool=0.08; G.player.leanDir=dir; G.player.leanT=0.16;
  };
  if(JP['ArrowLeft']||JP['KeyA']) moveStep(-1);
  else if((KEYS['ArrowLeft']||KEYS['KeyA'])&&moveCool<=0) moveStep(-1);
  if(JP['ArrowRight']||JP['KeyD']) moveStep(1);
  else if((KEYS['ArrowRight']||KEYS['KeyD'])&&moveCool<=0) moveStep(1);

  // Fire: faster rate + faster bullets
  if(KEYS['Space']&&fireCool<=0){
    G.bullets.push({lane:G.player.lane, depth:0.05, speed:3.0});
    fireCool=0.09; SFX.fire();
  }
  if(JP['KeyZ']) fireZapper();
}

// ============================================================
// SECTION 13 — GAME LOOP
// ============================================================

let lastT=0;
newGame(); resize();

function loop(ts) {
  const dt=Math.min((ts-lastT)/1000, 0.05); lastT=ts;
  G.dt=dt; G.now=ts;

  // Clear main canvas
  mainCtx.fillStyle='#000'; mainCtx.fillRect(0,0,W,H);

  switch(G.state) {

    case GS.ATTRACT:
      handleInput(dt);
      if(G.state===GS.ATTRACT) drawAttractScreen(); // guard: drawAttractScreen manages beginGeo/endGeo itself
      break;

    case GS.PLAYING: {
      // Pause toggle (P) — freeze all updates, silence the hum, show overlay
      if(JP['KeyP']){ G.paused=!G.paused; if(G.paused){ setWarpIntensity(0); G.warpInt=0; } }
      if(G.paused){
        const colp=getLevelDef(G.level).c;
        beginGeo();
        drawWeb(G.geo,colp);
        drawSpikes(G.geo,G.spikes);
        drawEnemies(G.geo,G.enemies,colp);
        if(G.player&&G.player.visible&&!G.player.dead) drawClaw(G.geo,G.player.lane,0,'#FFFF00');
        endGeo();
        drawHUD(colp);
        mainCtx.save();
        mainCtx.textAlign='center'; mainCtx.textBaseline='middle';
        mainCtx.font=`bold ${Math.min(W,H)*0.07}px monospace`;
        mainCtx.fillStyle='#FFFFFF';
        mainCtx.fillText('PAUSED',CX,CY-Math.min(W,H)*0.02);
        mainCtx.font=`${Math.min(W,H)*0.026}px monospace`;
        mainCtx.fillStyle='#AAAAAA';
        mainCtx.fillText('PRESS P TO RESUME',CX,CY+Math.min(W,H)*0.05);
        mainCtx.restore();
        break;
      }

      handleInput(dt);
      if(G.player&&G.player.leanT>0) G.player.leanT=Math.max(0,G.player.leanT-dt);
      if(G.player&&G.player.moveT>0) G.player.moveT=Math.max(0,G.player.moveT-dt);
      if(G.invinc>0){
        G.invinc-=dt; G.player.blinkT-=dt;
        G.player.visible=Math.floor(G.player.blinkT*9)%2===0;
        if(G.invinc<=0){G.invinc=0;G.player.visible=true;}
      }
      updateBullets(dt);
      updateEnemies(dt);
      updateEffects(dt);

      if(G.player&&!G.player.dead&&G.invinc<=0){
        for(const s of G.spikes){ if(s.lane===G.player.lane&&s.tipD<=0){ hitPlayer(); break; } }
      }

      if(!G.cleared&&G.waveLeft===0&&G.enemies.length===0){
        G.cleared=true;
        SFX.levelDone();
        setTimeout(()=>startFlythrough(),600);
      }

      const col=getLevelDef(G.level).c;

      // Geometry → offscreen with bloom
      beginGeo();
      if(G.shake.t>0){ ctx.save(); ctx.translate(G.shake.x,G.shake.y); }
      drawWeb(G.geo,col);
      drawLiveSpikeTrails(G.geo,G.enemies);
      drawSpikes(G.geo,G.spikes);
      drawEnemies(G.geo,G.enemies,col);
      drawEBullets(G.geo,G.eBullets);
      drawBullets(G.geo,G.bullets);
      if(G.player&&G.player.visible&&!G.player.dead) drawClaw(G.geo,G.player.lane,0,'#FFFF00');
      drawExplosions(); drawScorePopups();
      if(G.shake.t>0) ctx.restore();
      endGeo();

      // HUD + flash on main (crisp)
      drawHUD(col);
      drawScreenFlash();
      break;
    }

    case GS.DEAD_PAUSE: {
      updateEffects(dt);
      const col2=getLevelDef(G.level).c;

      beginGeo();
      if(G.shake.t>0){ ctx.save(); ctx.translate(G.shake.x,G.shake.y); }
      drawWeb(G.geo,col2);
      drawSpikes(G.geo,G.spikes);
      drawEnemies(G.geo,G.enemies,col2);
      drawExplosions();
      if(G.shake.t>0) ctx.restore();
      endGeo();

      drawHUD(col2);
      drawScreenFlash();
      break;
    }

    case GS.FLYTHROUGH: {
      updateFlythrough(dt);
      updateEffects(dt);
      const fscale = Math.min(5, 1/(1-G.flyDepth+0.02));
      const col3=getLevelDef(G.level).c;

      beginGeo();
      if(G.shake.t>0){ ctx.save(); ctx.translate(G.shake.x,G.shake.y); }
      drawWeb(G.geo,col3,fscale);
      drawFlythroughOverlay(G.geo,G.flyLane,G.flyDepth);
      drawExplosions();
      if(G.shake.t>0) ctx.restore();
      endGeo();

      drawScreenFlash();
      mainCtx.save(); mainCtx.textAlign='center'; mainCtx.textBaseline='bottom';
      mainCtx.font=`${Math.min(W,H)*0.025}px monospace`;
      mainCtx.fillStyle='#AAAAAA'; mainCtx.fillText('WARP',CX,H-14);
      mainCtx.restore();
      break;
    }

    case GS.LEVEL_TITLE: {
      G.titleT+=dt;
      const col4=getLevelDef(G.level).c;

      beginGeo();
      drawWeb(G.geo,col4);
      endGeo();

      drawLevelTitleScreen();
      if(G.titleT>=2.0) G.state=GS.PLAYING;
      break;
    }

    case GS.GAME_OVER:
      handleInput(dt);
      drawGameOverScreen();
      drawScreenFlash();
      break;
  }

  Object.keys(JP).forEach(k=>delete JP[k]);
  requestAnimationFrame(loop);
}

requestAnimationFrame(t=>{ lastT=t; requestAnimationFrame(loop); });
</script>
